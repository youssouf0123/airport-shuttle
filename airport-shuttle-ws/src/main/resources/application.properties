server.port=${PORT:8088}
server.address=${BIND_ADDRESS:127.0.0.1}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/airport_shuttle?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:airport_shuttle}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jackson.time-zone=UTC
spring.web.resources.static-locations=file:../dist/,classpath:/static/
spring.mvc.async.request-timeout=60000
shuttle.seed-demo=${SEED_DEMO:false}
shuttle.demo-password=${DEMO_PASSWORD:}
server.error.include-message=never
